<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Haris journey</title>
<style>
@font-face { font-family: "IBM Plex Sans Arabic"; font-weight: 400; src: url(fonts/IBMPlexSansArabic-Regular.ttf); }
@font-face { font-family: "IBM Plex Sans Arabic"; font-weight: 500; src: url(fonts/IBMPlexSansArabic-Medium.ttf); }
@font-face { font-family: "IBM Plex Sans Arabic"; font-weight: 600; src: url(fonts/IBMPlexSansArabic-SemiBold.ttf); }
@font-face { font-family: "IBM Plex Sans Arabic"; font-weight: 700; src: url(fonts/IBMPlexSansArabic-Bold.ttf); }
@font-face { font-family: "IBM Plex Sans Devanagari"; font-weight: 400; src: url(fonts/IBMPlexSansDevanagari-Regular.ttf); }
@font-face { font-family: "IBM Plex Sans Devanagari"; font-weight: 600; src: url(fonts/IBMPlexSansDevanagari-SemiBold.ttf); }
@font-face { font-family: "IBM Plex Sans Devanagari"; font-weight: 700; src: url(fonts/IBMPlexSansDevanagari-Bold.ttf); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; }
body { background: #F1F5F4; color: #1B2330; font-family: var(--font), "IBM Plex Sans Arabic", "Inter", "IBM Plex Sans Devanagari", sans-serif; }
.abs { position: absolute; }
:root { --brand: #0A4740; --gold: #B08A3E; --gold2: #E7C77A; --muted: #5B6770; --line: #DCE4E1; --high: #B42318; --warn: #B54708; --ok: #10633D; }
#map { width: 880px; }
#band { left: 0; right: 0; bottom: 0; height: 74px; background: var(--brand); border-top: 6px solid var(--gold); display: flex; align-items: center; gap: 16px; padding: 0 56px; color: #fff; font-size: 23px; z-index: 20; }
#band img { width: 44px; height: 44px; border-radius: 50%; background: #fff; }
#bubble { background: #fff; border-radius: 32px; padding: 26px 34px 30px; box-shadow: 0 14px 40px rgba(10,46,42,.14); border: 3px solid #D7E3DF; z-index: 12; }
#bubble .tail { position: absolute; width: 0; height: 0; }
#persona { display: inline-block; font-size: 23px; font-weight: 700; color: var(--brand); background: #E4F2EC; border-radius: 12px; padding: 4px 14px; margin-bottom: 12px; }
#cap { font-size: 36px; line-height: 1.55; font-weight: 600; color: #0A2E2A; }
#haris { z-index: 11; }
.scene { position: absolute; }
.ltr { direction: ltr; unicode-bidi: isolate; }

/* phones */
.phone { position: absolute; width: 520px; height: 880px; border-radius: 60px; background: #10181A; padding: 14px; box-shadow: 0 24px 60px rgba(10,46,42,.28); }
.screen { position: relative; width: 100%; height: 100%; border-radius: 47px; overflow: hidden; background: #EFE9E1; display: flex; flex-direction: column; }
.wahead { display: flex; align-items: center; gap: 12px; padding: 44px 18px 14px; background: var(--brand); color: #fff; flex: none; }
.wahead img { width: 54px; height: 54px; border-radius: 50%; background: #fff; }
.wahead b { font-size: 25px; display: flex; align-items: center; gap: 6px; }
.wahead small { display: block; font-size: 17px; opacity: .85; }
.chat { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; padding: 14px; overflow: hidden; }
.chat > * { flex: none; }
.in, .out { max-width: 88%; padding: 12px 16px; border-radius: 18px; font-size: 21px; line-height: 1.5; background: #fff; box-shadow: 0 1px 1px rgba(0,0,0,.08); }
.in { align-self: flex-start; border-start-start-radius: 4px; }
.out { align-self: flex-end; background: #D9F2DD; border-start-end-radius: 4px; }
.fwd { font-size: 16px; color: var(--muted); font-style: italic; margin-bottom: 4px; }
.risk { font-weight: 700; color: #A11D12; font-size: 23px; margin-bottom: 4px; }
.btns { align-self: flex-start; width: 88%; display: flex; flex-direction: column; gap: 6px; }
.btn { background: #fff; border-radius: 14px; padding: 11px; text-align: center; font-size: 20px; font-weight: 600; color: var(--brand); box-shadow: 0 1px 1px rgba(0,0,0,.08); }
.composer { flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 12px 26px; }
.composer .field { flex: 1; min-height: 46px; border-radius: 23px; background: #fff; display: flex; align-items: center; padding: 6px 16px; font-size: 19px; color: var(--muted); }
.composer .send { flex: none; width: 46px; height: 46px; border-radius: 50%; background: var(--brand); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 24px 24px 0 0; padding: 18px 18px 30px; box-shadow: 0 -8px 30px rgba(0,0,0,.18); z-index: 3; }
.sheet h4 { font-size: 21px; color: var(--muted); margin-bottom: 8px; }
.rowi { padding: 15px 8px; border-bottom: 1px solid #EEF1F0; font-size: 22px; font-weight: 600; }
.sys { align-self: center; max-width: 92%; text-align: center; font-size: 18px; padding: 6px 14px; border-radius: 10px; background: #FFF6E5; color: #6B4E12; }
.card { align-self: stretch; background: #fff; border-radius: 16px; padding: 14px 16px; font-size: 20px; line-height: 1.5; }
.card.gold { border: 3px solid var(--gold); background: #FFF8E8; }
.card.green { border: 3px solid #1E8E5A; background: #E7F5EE; color: #10633D; font-weight: 700; }
.card.dark { background: var(--brand); color: #fff; font-weight: 700; }
.line { padding: 6px 0; font-weight: 600; }
.voice { display: flex; align-items: center; gap: 10px; background: #E4F2EC; border-radius: 30px; padding: 10px 14px; align-self: stretch; }
.play { width: 40px; height: 40px; border-radius: 50%; background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; }
.bars { display: flex; gap: 4px; align-items: center; height: 34px; }
.bars i { display: block; width: 5px; border-radius: 3px; background: var(--brand); }
.fld { align-self: stretch; display: flex; justify-content: space-between; align-items: center; background: #fff; border-radius: 12px; padding: 12px 16px; font-size: 21px; }
.fld span { color: var(--muted); }
.tick { width: 24px; height: 24px; border-radius: 50%; background: #1E8E5A; display: inline-flex; align-items: center; justify-content: center; vertical-align: middle; }
.tap { outline: 4px solid var(--gold); outline-offset: 2px; }

/* the dashboard */
.dash { position: absolute; inset: 0; background: #F4F6F5; border-radius: 22px; overflow: hidden; box-shadow: 0 24px 60px rgba(10,46,42,.22); border: 1px solid #D5DFDB; }
.dbar { height: 78px; background: var(--brand); color: #fff; display: flex; align-items: center; gap: 14px; padding: 0 24px; }
.dbar img { width: 46px; height: 46px; border-radius: 50%; background: #fff; }
.dbar b { font-size: 26px; white-space: nowrap; }
.narrow .dtabs { display: none; }
.dtabs { display: flex; gap: 6px; margin-inline-start: 18px; }
.dtabs span { white-space: nowrap; font-size: 19px; padding: 6px 14px; border-radius: 10px; opacity: .8; }
.dtabs span.on { background: rgba(255,255,255,.16); opacity: 1; font-weight: 700; }
.demo { white-space: nowrap; margin-inline-start: auto; background: var(--gold2); color: #3A2A06; font-weight: 700; font-size: 18px; border-radius: 10px; padding: 5px 14px; }
.dbody { position: absolute; top: 78px; inset-inline: 0; bottom: 0; padding: 22px; display: grid; grid-template-columns: 480px 1fr; gap: 20px; }
.queue { position: relative; overflow: hidden; }
.qrow { position: absolute; inset-inline: 0; min-height: 134px; background: #fff; border: 1px solid var(--line); border-inline-start: 8px solid #98a2ab; border-radius: 14px; padding: 12px 16px; display: flex; flex-direction: column; gap: 4px; }
.qrow.critical { border-inline-start-color: #8e1414; } .qrow.financial { border-inline-start-color: var(--high); } .qrow.medium { border-inline-start-color: var(--warn); }
.qtop { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; }
.pr { display: inline-block; font-size: 16px; font-weight: 700; padding: 2px 12px; border-radius: 999px; color: #fff; white-space: nowrap; }
.pr.critical { background: #8e1414; } .pr.financial { background: var(--high); } .pr.medium { background: var(--warn); } .pr.indicator { background: #98a2ab; }
.sts { font-size: 15px; font-weight: 700; padding: 1px 10px; border-radius: 999px; border: 2px solid currentColor; white-space: nowrap; }
.sts.new { color: var(--high); } .sts.received { color: var(--brand); } .sts.info { color: var(--warn); }
.ref { margin-inline-start: auto; font-size: 15px; font-weight: 700; color: var(--muted); }
.qwhat { font-size: 22px; font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.qmeta { font-size: 18px; color: var(--muted); }
.chip { display: inline-block; font-size: 16px; font-weight: 700; border-radius: 8px; padding: 2px 10px; background: #E4F2EC; color: var(--brand); white-space: nowrap; }
.chip.soon { background: #FFF1D6; color: #8A5A00; }
.glow { box-shadow: 0 0 0 4px var(--gold2), 0 10px 26px rgba(176,138,62,.35); }
.detail { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 18px 22px; display: flex; flex-direction: column; gap: 10px; font-size: 20px; overflow: hidden; }
.dhead { display: flex; align-items: center; gap: 8px; }
.dhead h2 { font-size: 22px; margin-inline-start: auto; color: var(--muted); }
.dtitle { font-size: 27px; font-weight: 700; color: #1B2330; }
.verified { align-self: flex-start; font-size: 18px; font-weight: 700; color: var(--ok); background: #E7F5EE; border-radius: 8px; padding: 3px 12px; }
.hint { border-radius: 10px; padding: 10px 14px; font-size: 20px; font-weight: 600; background: #FEF3F2; color: var(--high); line-height: 1.5; }
.banner { border-radius: 10px; padding: 10px 14px; font-size: 19px; line-height: 1.5; background: #FFF6E2; border: 2px solid var(--gold2); color: #5A3E06; }
.banner b { display: block; }
.langb { border-radius: 10px; padding: 8px 14px; font-size: 18px; background: #EAF1FB; color: #1F4E8C; line-height: 1.5; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; font-size: 20px; }
.facts dt { color: var(--muted); } .facts dd { font-weight: 600; }
.detail h3 { font-size: 19px; color: var(--muted); margin-top: 4px; }
blockquote { border-inline-start: 5px solid var(--brand); background: #F4F7F6; border-radius: 8px; padding: 10px 14px; font-size: 21px; line-height: 1.55; }
.orig { border: 2px dashed #C9D3D0; border-radius: 10px; padding: 8px 14px; font-size: 18px; color: var(--muted); }
.orig blockquote { margin-top: 8px; border-inline-start-color: #98a2ab; color: #1B2330; font-size: 20px; }
.acts { display: flex; gap: 10px; margin-top: auto; border-top: 1px solid var(--line); padding-top: 14px; }
.dbtn { font-size: 20px; font-weight: 700; border-radius: 10px; padding: 10px 20px; border: 2px solid var(--brand); color: var(--brand); background: #fff; }
.dbtn.primary { background: var(--brand); color: #fff; }
.timeline { list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 19px; }
.timeline li { border-inline-start: 4px solid var(--line); padding-inline-start: 12px; }
.timeline li.reply { border-inline-start-color: var(--brand); }
.timeline .note { display: block; background: #F4F7F6; border-radius: 8px; padding: 8px 12px; margin-top: 4px; font-size: 20px; }
.ta { border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 64px; font-size: 21px; background: #fff; }
.dnotif { position: absolute; inset-inline-start: 30px; bottom: 30px; width: 476px; background: rgba(255,255,255,.98); border-radius: 22px; padding: 16px 18px; box-shadow: 0 16px 40px rgba(0,0,0,.28); z-index: 4; border: 1px solid #E2E8E6; }
.napp { display: flex; align-items: center; gap: 8px; font-size: 16px; color: var(--muted); }
.waicon { flex: none; width: 30px; height: 30px; border-radius: 50%; background: #1E8E5A; display: inline-block; }
.dnotif b { display: block; font-size: 21px; margin-top: 6px; line-height: 1.45; }

/* full scenes */
.fullbg { position: absolute; inset: 0; }
.row { position: absolute; inset: 0; display: flex; align-items: center; gap: 90px; padding: 40px 150px 40px; }
.ptxt h1 { font-size: 150px; color: var(--gold); line-height: 1.1; }
.ptxt .tag { font-size: 40px; font-weight: 700; color: var(--brand); margin-top: 10px; line-height: 1.4; }
.ptxt .step { font-size: 34px; font-weight: 600; color: #1B2330; margin-top: 40px; line-height: 1.55; background: #fff; border-radius: 22px; padding: 22px 28px; border: 3px solid #D7E3DF; }
.pbox { position: relative; flex: none; width: 637px; height: 900px; }
.pbox > img { width: 637px; height: 900px; border-radius: 18px; box-shadow: 0 20px 50px rgba(10,46,42,.22); }
.cam { position: absolute; width: 330px; height: 560px; border-radius: 48px; background: #10181A; padding: 12px; box-shadow: 0 24px 60px rgba(0,0,0,.35); }
.cam .view { position: relative; width: 100%; height: 100%; border-radius: 38px; overflow: hidden; background: #2a3436; display: flex; align-items: center; justify-content: center; }
.cam .view img { width: 230px; height: 230px; background: #fff; padding: 10px; border-radius: 8px; }
.corner { position: absolute; width: 270px; height: 270px; border: 5px solid var(--gold2); border-radius: 18px; }
.scanline { position: absolute; left: 40px; right: 40px; height: 4px; background: var(--gold2); box-shadow: 0 0 18px var(--gold2); }
.toast { position: absolute; left: 14px; right: 14px; top: 30px; background: #fff; border-radius: 16px; padding: 12px 14px; font-size: 15px; display: flex; gap: 10px; align-items: center; }
.toast b { display: block; font-size: 16px; }
.lock { position: relative; flex: none; width: 470px; height: 860px; border-radius: 60px; background: #10181A; padding: 14px; box-shadow: 0 24px 60px rgba(0,0,0,.4); }
.lock .scr { width: 100%; height: 100%; border-radius: 47px; background: linear-gradient(170deg, #2C5E57, #12302C); padding: 90px 16px 20px; display: flex; flex-direction: column; gap: 12px; }
.clock { text-align: center; color: #fff; font-size: 76px; font-weight: 300; margin-bottom: 20px; font-family: "Inter", sans-serif; }
.sms { background: rgba(255,255,255,.93); border-radius: 20px; padding: 13px 16px; font-size: 19px; line-height: 1.45; }
.sms b { display: flex; align-items: center; gap: 8px; font-size: 18px; }
.sms b::before { content: ""; width: 26px; height: 26px; border-radius: 7px; background: #34C759; display: inline-block; }
.ptext { color: #fff; display: flex; flex-direction: column; gap: 40px; }
.ptext div { font-size: 58px; font-weight: 700; line-height: 1.4; }
.ptext .gold { color: var(--gold2); font-size: 70px; }

/* wide info scenes */
.panel { position: absolute; inset: 0; background: #fff; border-radius: 28px; box-shadow: 0 24px 60px rgba(10,46,42,.16); padding: 52px 60px; border: 1px solid #DCE5E2; display: flex; flex-direction: column; justify-content: center; }
.panel h2 { font-size: 54px; color: var(--brand); margin-bottom: 40px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
.pcard { display: flex; align-items: center; gap: 24px; background: #F1F5F4; border-radius: 24px; padding: 34px; font-size: 35px; font-weight: 700; line-height: 1.45; min-height: 260px; }
.ic { flex: none; width: 92px; height: 92px; border-radius: 50%; background: var(--brand); display: flex; align-items: center; justify-content: center; font-size: 44px; }
.flow { display: flex; align-items: stretch; gap: 0; }
.node { flex: 1; background: #F1F5F4; border-radius: 24px; padding: 26px 18px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.node .ic { width: 96px; height: 96px; }
.node b { font-size: 29px; color: var(--brand); line-height: 1.3; }
.node > span:not(.ic) { font-size: 22px; color: var(--muted); line-height: 1.45; }
.node.haris { background: var(--brand); } .node.haris b { color: var(--gold2); } .node.haris > span:not(.ic) { color: #CFE3DD; } .node.haris .ic { background: #fff; }
.arrow { flex: none; width: 70px; display: flex; align-items: center; justify-content: center; position: relative; }
.arrow svg { width: 48px; height: 48px; }
[dir="rtl"] .arrow svg { transform: scaleX(-1); }
.fallback { margin-top: 36px; background: #FFF6E2; border: 3px solid var(--gold2); color: #5A3E06; border-radius: 20px; padding: 22px 28px; font-size: 30px; font-weight: 700; }
.tech { margin-top: 26px; display: flex; gap: 12px; flex-wrap: wrap; }
.tech span { direction: ltr; font-size: 22px; font-weight: 600; background: #EEF2F1; color: #33424D; border-radius: 12px; padding: 8px 18px; font-family: "Inter", sans-serif; }
.roles { display: flex; flex-direction: column; gap: 22px; }
.roles .pcard { min-height: 0; padding: 26px 34px; font-size: 44px; }
.tl { display: flex; flex-direction: column; gap: 34px; position: relative; }
.tli { display: flex; gap: 24px; align-items: flex-start; }
.tli .ic { width: 96px; height: 96px; font-size: 44px; }
.tli b { display: block; font-size: 40px; color: var(--brand); }
.tli div > span { display: block; font-size: 29px; color: #33424D; line-height: 1.5; margin-top: 2px; }
.minis { display: flex; justify-content: space-between; gap: 18px; }
.mini { flex: 1; height: 720px; border-radius: 40px; background: #10181A; padding: 10px; box-shadow: 0 18px 40px rgba(10,46,42,.25); }
.mini .scr { width: 100%; height: 100%; border-radius: 31px; background: linear-gradient(170deg, #2C5E57, #12302C); padding: 26px 10px 10px; display: flex; flex-direction: column; gap: 12px; }
.mini .lname { text-align: center; color: #fff; font-size: 24px; font-weight: 700; padding: 6px 0 14px; }
.mini .sms { font-size: 19px; padding: 14px 13px; line-height: 1.5; }
.mini .sms b { font-size: 17px; margin-bottom: 4px; }
.mini .sms b::before { background: #1E8E5A; border-radius: 50%; }
.stopline { margin-top: 26px; text-align: center; font-size: 28px; font-weight: 700; color: var(--brand); }
.prev { display: flex; flex-direction: column; gap: 10px; }
.pv { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: 18px; line-height: 1.5; }
.pv .chip { margin-bottom: 4px; }
.camp { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.camp .big { font-size: 80px; font-weight: 700; color: var(--high); line-height: 1; font-family: "Inter", sans-serif; }
.spark { display: flex; align-items: flex-end; gap: 8px; height: 150px; padding: 10px; background: #F7F9F8; border-radius: 12px; }
.spark i { flex: 1; background: var(--high); border-radius: 4px 4px 0 0; opacity: .85; }
.approved { background: #E7F5EE; border: 3px solid #1E8E5A; color: #10633D; border-radius: 12px; padding: 12px 16px; font-size: 21px; font-weight: 700; }

/* the end */
.hero { position: absolute; inset: 0; background: var(--brand); overflow: hidden; }
.hero .mapbg { position: absolute; width: 1100px; opacity: .14; }
.heroc { position: absolute; top: 0; bottom: 0; justify-content: center; width: 1150px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; }
.heroc .s1 { font-size: 130px; font-weight: 700; color: var(--gold2); line-height: 1.1; }
.heroc .s2 { font-size: 72px; font-weight: 700; color: #fff; line-height: 1.3; }
.heroc .chips { display: flex; gap: 14px; margin-top: 8px; }
.heroc .chips span { border: 3px solid var(--gold2); color: var(--gold2); border-radius: 999px; padding: 6px 24px; font-size: 30px; font-weight: 700; }
.heroc .guards { font-size: 38px; font-weight: 700; color: var(--gold2); }
.qrcard { margin-top: 26px; display: flex; align-items: center; gap: 30px; background: #fff; border-radius: 30px; padding: 22px 34px; border: 6px solid var(--gold); }
.qrcard img { width: 230px; height: 230px; }
.qrcard b { font-size: 46px; color: var(--brand); display: block; }
.qrcard span { font-size: 26px; color: #33424D; display: block; margin-top: 8px; max-width: 400px; line-height: 1.45; }
</style>
</head>
<body>
<div id="stage" class="abs" style="inset:0">
  <img id="map" class="abs" src="../poster/uae-map.svg" alt="">
  <div id="scenes"></div>
  <svg id="haris" class="abs" width="620" height="775" viewBox="0 0 640 800" style="overflow:visible">
    <ellipse cx="320" cy="782" rx="135" ry="12" fill="#DCE5E2"/>
    <path d="M254 770 h56 a8 8 0 0 1 0 16 h-56 a8 8 0 0 1 0-16 Z" fill="#6B4A2F"/>
    <path d="M330 770 h56 a8 8 0 0 1 0 16 h-56 a8 8 0 0 1 0-16 Z" fill="#6B4A2F"/>
    <g id="body">
      <path d="M236 330 C240 302 272 292 320 292 C368 292 400 302 404 330 L430 762 C396 774 244 774 210 762 Z" fill="#FFFFFF" stroke="#D5DEDB" stroke-width="3"/>
      <path d="M320 304 L320 760" stroke="#EEF2F1" stroke-width="2"/>
      <path d="M320 300 L320 400" stroke="#C9D3D0" stroke-width="5" stroke-linecap="round"/>
      <g id="armR">
        <path d="M398 334 C424 356 438 450 434 556 L396 560 C398 486 390 424 374 386 Z" fill="#FFFFFF" stroke="#D5DEDB" stroke-width="3"/>
        <ellipse cx="415" cy="574" rx="19" ry="21" fill="#D9A47A"/>
      </g>
      <g id="armL">
        <path d="M242 334 C216 356 202 450 206 556 L244 560 C242 486 250 424 266 386 Z" fill="#FFFFFF" stroke="#D5DEDB" stroke-width="3"/>
        <ellipse cx="225" cy="574" rx="19" ry="21" fill="#D9A47A"/>
      </g>
      <g id="headSway"><g id="head">
        <g transform="translate(320 190) scale(2.15) translate(-100 -98)">

        <div class="approved" data-at="9.4">${esc(u.radar.approved)}</div>
      </div><div class="detail" data-at="3.6" style="gap:10px"><b style="font-size:23px">${esc(u.radar.preview)}</b><div class="prev">
        ${R.alerts.map(([l, name, title, text], i) => `<div class="pv" data-at="${4.0 + i * 0.8}" dir="${["ar", "ur"].includes(l) ? "rtl" : "ltr"}"><span class="chip">${esc(name)}</span><div><b>${esc(title)}</b> ${esc(text)}</div></div>`).join("")}</div>
        <div class="acts" style="margin-top:6px"><span class="dbtn primary" data-tapat="8.9">${esc(u.radar.approve)}</span></div>
      </div></div></div>`,
    broadcast: `<div class="panel" style="padding:44px 40px"><div class="minis">
      ${R.alerts.map(([l, name, title, text], i) => `<div class="mini" data-at="${0.6 + i * 0.7}"><div class="scr"><div class="lname">${esc(name)}</div>
        <div class="sms" dir="${["ar", "ur"].includes(l) ? "rtl" : "ltr"}" data-at="${1.0 + i * 0.7}"><b>${esc(u.broadcast.app)}</b><div style="font-weight:700;margin-bottom:4px">${esc(title)}</div>${esc(text)}</div></div></div>`).join("")}
      </div><div class="stopline" data-at="5.0">${esc(u.broadcast.stop)}</div></div>`,
    privacy: `<div class="panel"><h2 data-at="0.2">🔒 ${esc(u.privacy.title)}</h2><div class="grid2">
      ${u.privacy.items.map(([ic, t], i) => `<div class="pcard" data-at="${0.8 + i * 1.3}"><span class="ic">${ic}</span><span>${esc(t)}</span></div>`).join("")}</div></div>`,
    evidence: `<div class="panel"><h2 data-at="0.2">🧾 ${esc(u.evidence.title)}</h2><div class="grid2">
      ${u.evidence.items.map(([ic, t], i) => `<div class="pcard" data-at="${0.8 + i * 1.3}"><span class="ic">${ic}</span><span>${esc(t)}</span></div>`).join("")}</div></div>`,
    today: `<div class="panel"><h2 data-at="0.2">✅ ${esc(u.today.title)}</h2><div class="grid2">
      ${u.today.items.map(([ic, t], i) => `<div class="pcard" data-at="${0.7 + i * 0.9}"><span class="ic">${ic}</span><span>${esc(t)}</span></div>`).join("")}</div>
      <div class="fallback" data-at="7.0">${esc(u.today.stats)}</div></div>`,
    how: `<div class="panel"><h2 data-at="0.2">⚙️ ${esc(u.how.title)}</h2><div class="flow">
      ${u.how.nodes.map(([ic, b, s], i) => (i ? `<div class="arrow" data-at="${0.4 + i * 1.1}">${ARROW}</div>` : "") + `<div class="node ${i === 1 ? "haris" : ""}" data-at="${0.6 + i * 1.1}"><span class="ic">${i === 1 ? `<img src="${LOGO}" style="width:96px;height:96px;border-radius:50%">` : ic}</span><b>${esc(b)}</b><span>${esc(s)}</span></div>`).join("")}</div>
      <div class="fallback" data-at="5.6">${esc(u.how.fallback)}</div>
      <div class="tech" data-at="7.0">${u.how.tech.map((t) => `<span>${esc(t)}</span>`).join("")}</div></div>`,
    role: `<div class="panel"><h2 data-at="0.2">${esc(u.role.title)}</h2><div class="roles">
      ${u.role.items.map(([ic, t], i) => `<div class="pcard" data-at="${0.8 + i * 1.2}"><span class="ic">${ic}</span><span>${esc(t)}</span></div>`).join("")}</div></div>`,
    future: `<div class="panel"><h2 data-at="0.2">🚀 ${esc(u.future.title)}</h2><div class="tl">
      ${u.future.items.map(([ic, b, s], i) => `<div class="tli" data-at="${0.9 + i * 1.6}"><span class="ic">${ic}</span><div><b>${esc(b)}</b><span>${esc(s)}</span></div></div>`).join("")}</div></div>`,
    outro: `<div class="hero"><img class="mapbg" src="../poster/uae-map-light.svg" alt="" style="inset-inline-start:40px;top:160px">
      <div class="heroc" style="inset-inline-end:60px"><div class="s1" data-at="0.3">${esc(u.outro.s1)}</div><div class="s2" data-at="0.8">${esc(u.outro.s2)}</div>
      <div class="chips" data-at="1.3">${u.outro.chips.map((c) => `<span>${esc(c)}</span>`).join("")}</div>
      <div class="guards" data-at="1.8">${esc(u.outro.guards)}</div>
      <div class="qrcard" data-at="2.4"><img src="../poster/qr.svg" alt=""><div style="text-align:start"><b>${esc(u.outro.try)}</b><span>${esc(u.outro.scan)}</span></div></div></div></div>`,
  };
  const root = document.getElementById("scenes");
  D.scenes.forEach((sc, i) => {
    const s = document.createElement("div");
    s.className = "scene"; s.dataset.i = i; s.innerHTML = S[sc.k];
    const [x, y, w, h] = MODES[sc.mode].box;
    Object.assign(s.style, { left: X(x, w) + "px", top: y + "px", width: w + "px", height: h + "px" });
    root.appendChild(s);
  });
}

function init(data) {
  D = data; U = D.ui; R = D.shared;
  rtl = U.dir === "rtl";
  document.documentElement.dir = U.dir;
  document.documentElement.lang = D.lang;
  document.body.style.setProperty("--font", `"${U.font}"`);
  document.getElementById("footer").textContent = U.footer;
  build();
  let t = D.lead;
  starts = D.scenes.map((s) => { const a = t; t += s.dur; return a; });
  const m = document.getElementById("map");
  Object.assign(m.style, { left: X(1010, 880) + "px", top: "270px" });
  if (!rtl) document.getElementById("haris").style.transform = "scaleX(-1)";
  buildMotion();
}

// Haris's motion as one GSAP timeline, seeked to each frame: a blink every 3 seconds, a nod and a
// pointing gesture with every spoken line, and a wave at the end.
let TL;
function buildMotion() {
  const head = document.getElementById("head"), arm = document.getElementById("armL");
  const eyes = [document.getElementById("eyeL"), document.getElementById("eyeR")];
  TL = gsap.timeline({ paused: true });
  gsap.set(head, { svgOrigin: "320 300", rotation: 0, y: 0 });
  gsap.set(arm, { svgOrigin: "244 346", rotation: 18 });
  for (let b = 3; b < D.total; b += 3) {
    TL.to(eyes, { attr: { ry: 0.6 }, duration: 0.07, ease: "power1.in" }, b)
      .to(eyes, { attr: { ry: 5 }, duration: 0.1, ease: "power1.out" }, b + 0.07);
  }
  const sceneAt = (t) => { let k = 0; starts.forEach((s, i) => { if (t >= s) k = i; }); return k; };
  const baseOf = (mode) => (mode === "hero" ? 125 : mode === "full" ? 18 : 48);
  starts.forEach((s, i) => {
    const mode = D.scenes[i].mode, base = baseOf(mode);
    TL.to(arm, { rotation: base, duration: 0.7, ease: "power2.inOut" }, s + 0.05);
    if (mode === "hero") {
      for (let w = 0; w < 4; w++) {
        TL.to(arm, { rotation: base + 14, duration: 0.25, ease: "sine.inOut" }, s + 0.9 + w * 0.5)
          .to(arm, { rotation: base - 8, duration: 0.25, ease: "sine.inOut" }, s + 1.15 + w * 0.5);
      }
      TL.to(arm, { rotation: base, duration: 0.3, ease: "sine.inOut" }, s + 2.95);
    }
  });
  // spoken lines; without a voice, each caption stands in for one
  let speech = D.speech;
  if (!speech.length) {
    speech = [];
    D.scenes.forEach((sc, i) => (U.captions[sc.k] || []).forEach(([at]) => speech.push([starts[i] + at, 3])));
  }
  speech.forEach(([t, len]) => {
    const mode = D.scenes[sceneAt(t)].mode, base = baseOf(mode);
    if (mode === "full") return;
    TL.to(head, { rotation: -2.5, y: 3, duration: 0.22, ease: "power2.out" }, t)
      .to(head, { rotation: 0.8, y: 0, duration: 0.45, ease: "power2.inOut" }, t + 0.22);
    if (len > 3) {
      TL.to(head, { rotation: 1.6, y: 2, duration: 0.3, ease: "sine.inOut" }, t + len * 0.5)
        .to(head, { rotation: 0, y: 0, duration: 0.4, ease: "sine.inOut" }, t + len * 0.5 + 0.3);
    }
    if (mode !== "hero") {
      TL.to(arm, { rotation: base + 12, duration: 0.3, ease: "power2.out" }, t + 0.05)
        .to(arm, { rotation: base - 3, duration: 0.5, ease: "sine.inOut" }, t + 0.35);
      if (len > 2.5) {
        TL.to(arm, { rotation: base + 7, duration: 0.35, ease: "sine.inOut" }, t + len * 0.55)
          .to(arm, { rotation: base, duration: 0.5, ease: "sine.inOut" }, t + len * 0.55 + 0.35);
      }
    }
  });
}

function layout(mode) { return MODES[mode]; }

function render(t) {
  let k = 0;
  starts.forEach((s, i) => { if (t >= s) k = i; });
  const sc = D.scenes[k], dur = sc.dur, lt = t - starts[k];
  const cur = layout(sc.mode), prev = layout((D.scenes[k - 1] || sc).mode);
  const mv = k ? ease((lt + 0.2) / 0.9) : 1;

  // Haris: moves between layouts
  const H = document.getElementById("haris");
  const hp = prev.haris || cur.haris, hc = cur.haris || prev.haris;
  const hop = lerp(prev.haris ? 1 : 0, cur.haris ? 1 : 0, mv);
  if (hc) {
    const w = lerp(hp[2], hc[2], mv), x = lerp(hp[0], hc[0], mv), y = lerp(hp[1], hc[1], mv);
    Object.assign(H.style, { left: X(x, w) + "px", top: y + "px", width: w + "px", height: w * 1.25 + "px", opacity: String(hop), display: hop > 0.01 ? "" : "none" });
  } else H.style.display = "none";
  document.getElementById("map").style.opacity = String(lerp(prev.map, cur.map, mv));

  // speech bubble: persona and timed captions
  const bub = document.getElementById("bubble"), cap = document.getElementById("cap"), per = document.getElementById("persona");
  const caps = U.captions[sc.k] || [];
  let ci = -1;
  caps.forEach(([a], i) => { if (lt >= a) ci = i; });
  if (cur.bubble && caps.length) {
    const [bx, by, bw, tailMode] = cur.bubble;
    Object.assign(bub.style, { left: X(bx, bw) + "px", top: by + "px", width: bw + "px", display: "" });
    const tail = bub.querySelector(".tail");
    tail.removeAttribute("style");
    if (tailMode === "side") {
      Object.assign(tail.style, { top: "70px", borderTop: "26px solid transparent", borderBottom: "26px solid transparent" });
      if (rtl) Object.assign(tail.style, { right: "-26px", borderLeft: "28px solid #fff" }); else Object.assign(tail.style, { left: "-26px", borderRight: "28px solid #fff" });
    } else {
      const off = cur.haris[0] + cur.haris[2] * 0.5 - bx - 26;
      Object.assign(tail.style, { bottom: "-26px", borderLeft: "26px solid transparent", borderRight: "26px solid transparent", borderTop: "28px solid #fff" });
      tail.style.left = (rtl ? off : bw - off - 52) + "px";
    }
    const key = `${k}:${ci}`;
    if (cap.dataset.k !== key) {
      cap.textContent = ci >= 0 ? caps[ci][1] : "";
      const p = (U.persona || {})[sc.k];
      per.textContent = p || ""; per.style.display = p ? "" : "none";
      cap.dataset.k = key;
    }
    const nextAt = ci + 1 < caps.length ? caps[ci + 1][0] : Infinity;
    const co = ci >= 0 ? Math.min(ease((lt - caps[ci][0]) / 0.35), ease((nextAt - lt) / 0.25)) : 0;
    cap.style.opacity = String(co);
    const bo = Math.min(ease((lt - 0.1) / 0.4), ease((dur - lt) / 0.3));
    bub.style.opacity = String(bo);
    bub.style.transform = `translateY(${(1 - bo) * 14}px)`;
  } else bub.style.display = "none";

  // scenes: crossfade, then items appear on time
  document.querySelectorAll(".scene").forEach((s) => {
    const i = +s.dataset.i, st = starts[i], d = D.scenes[i].dur, r = t - st;
    const vis = Math.min(ease((r + 0.4) / 0.4), ease((d - r) / 0.4));
    s.style.opacity = String(vis);
    s.style.visibility = vis > 0 ? "visible" : "hidden";
    s.style.transform = `translateY(${(1 - vis) * 20}px)`;
    if (vis <= 0) return;
    s.querySelectorAll("[data-at],[data-until]").forEach((n) => {
      const a = n.dataset.at ? +n.dataset.at : -1, u = n.dataset.until ? +n.dataset.until : Infinity;
      const on = r >= a && r < u;
      n.style.display = on ? "" : "none";
      if (!n.dataset.slots) {
        const o = ease((r - a) / 0.3);
        n.style.opacity = String(o);
        n.style.transform = `translateY(${(1 - o) * 10}px)`;
      }
    });
    s.querySelectorAll("[data-slots]").forEach((n) => {
      const steps = n.dataset.slots.split(",").map((p) => p.split(":").map(Number));
      let slot = steps[0][1];
      steps.forEach(([a, v], j) => { if (j && r >= a) slot = lerp(steps[j - 1][1], v, ease((r - a) / 0.6)); });
      n.style.top = slot * 150 + "px";
      const a = n.dataset.at ? +n.dataset.at : -1;
      n.style.opacity = String(ease((r - a) / 0.4));
    });
    s.querySelectorAll("[data-tapat]").forEach((n) => {
      const a = +n.dataset.tapat, on = r >= a && r < a + 0.45;
      n.classList.toggle("tap", on);
      n.style.scale = on ? "0.97" : "1";
    });
    s.querySelectorAll("[data-glow]").forEach((n) => {
      const [a, b] = n.dataset.glow.split(",").map(Number);
      n.classList.toggle("glow", r >= a && r < b);
    });
    s.querySelectorAll("[data-type]").forEach((n) => {
      const [a, len] = n.dataset.type.split(",").map(Number), full = n.dataset.full;
      const c = n.dataset.clear ? +n.dataset.clear : Infinity;
      const m = Math.round(clamp((r - a) / len) * full.length);
      const typing = r >= a && r < c && m > 0;
      if (n.classList.contains("field")) {
        n.textContent = typing ? full.slice(0, m) : (n.dataset.ph || (n.dataset.ph = n.textContent));
        n.style.color = typing ? "#1B2330" : "#5B6770";
      } else n.textContent = r >= a ? full.slice(0, m) : "";
    });
    s.querySelectorAll("[data-count]").forEach((n) => {
      const [a, len, to] = n.dataset.count.split(",").map(Number);
      n.textContent = String(Math.round(ease((r - a) / len) * to));
    });
    s.querySelectorAll("[data-grow]").forEach((n) => {
      const [a, h] = n.dataset.grow.split(",").map(Number);
      n.style.height = ease((r - a) / 0.5) * h * 9 + "px";
    });
    const sheet = s.querySelector("[data-sheet]");
    if (sheet) {
      const [a, b] = sheet.dataset.sheet.split(",").map(Number);
      const o = Math.min(ease((r - a) / 0.35), ease((b - r) / 0.3));
      sheet.style.transform = `translateY(${(1 - o) * 110}%)`;
    }
    const cam = s.querySelector("[data-cam]");
    if (cam) {
      const up = ease((r - 1.0) / 1.1), away = ease((r - 7.4) / 1.2);
      cam.style.top = (1000 - up * 660 + away * 900) + "px";
      const scan = s.querySelector("[data-scan]");
      const sp = clamp((r - 2.2) / 2.0);
      scan.style.top = (150 + Math.abs(Math.sin(sp * Math.PI * 2)) * 250) + "px";
      scan.style.opacity = r > 2.2 && r < 4.3 ? "1" : "0";
    }
    s.querySelectorAll("[data-wave]").forEach((n) => {
      const j = +n.dataset.wave;
      n.style.height = (8 + 24 * Math.abs(Math.sin(j * 1.7 + t * 6)) * (r > 0.6 && r < 2.4 ? 1 : 0.3)) + "px";
    });
  });

  // Haris: breathing, then the GSAP timeline (blinks, nods, gestures), then the mouth from the voice
  const bob = Math.sin(t * 2.1) * 4;
  document.getElementById("body").setAttribute("transform", `translate(0 ${bob})`);
  document.getElementById("headSway").setAttribute("transform", `rotate(${Math.sin(t * 1.3) * 1.2} 320 300)`);
  TL.time(Math.min(t, TL.duration()));
  const ry = +document.getElementById("eyeL").getAttribute("ry");
  document.getElementById("shine").style.opacity = ry < 2.5 ? "0" : "1";
  const o = D.lips.length ? (D.lips[Math.min(D.lips.length - 1, Math.round(t * 30))] || 0) : 0;
  const m = document.getElementById("mouthOpen");
  m.setAttribute("opacity", o > 0.04 ? "1" : "0");
  m.setAttribute("transform", `translate(100 118.6) scale(${0.85 + 0.15 * o} ${0.18 + 0.82 * o}) translate(-100 -118.6)`);
  document.getElementById("smile").style.opacity = String(1 - Math.min(1, o * 3));
}
</script>
