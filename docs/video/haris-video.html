<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Haris explainer</title>
<style>
@font-face { font-family: "IBM Plex Sans Arabic"; font-weight: 400; src: url(fonts/IBMPlexSansArabic-Regular.ttf); }
@font-face { font-family: "IBM Plex Sans Arabic"; font-weight: 500; src: url(fonts/IBMPlexSansArabic-Medium.ttf); }
@font-face { font-family: "IBM Plex Sans Arabic"; font-weight: 600; src: url(fonts/IBMPlexSansArabic-SemiBold.ttf); }
@font-face { font-family: "IBM Plex Sans Arabic"; font-weight: 700; src: url(fonts/IBMPlexSansArabic-Bold.ttf); }
@font-face { font-family: "IBM Plex Sans Devanagari"; font-weight: 400; src: url(fonts/IBMPlexSansDevanagari-Regular.ttf); }
@font-face { font-family: "IBM Plex Sans Devanagari"; font-weight: 500; src: url(fonts/IBMPlexSansDevanagari-Medium.ttf); }
@font-face { font-family: "IBM Plex Sans Devanagari"; font-weight: 600; src: url(fonts/IBMPlexSansDevanagari-SemiBold.ttf); }
@font-face { font-family: "IBM Plex Sans Devanagari"; font-weight: 700; src: url(fonts/IBMPlexSansDevanagari-Bold.ttf); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; }
body { background: #F1F5F4; color: #1B2330; font-family: var(--font), "IBM Plex Sans Arabic", sans-serif; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
.abs { position: absolute; }
#map { width: 880px; }
#band { left: 0; right: 0; bottom: 0; height: 74px; background: #0A4740; border-top: 6px solid #B08A3E; display: flex; align-items: center; gap: 16px; padding: 0 56px; color: #fff; font-size: 24px; }
#band img { width: 44px; height: 44px; border-radius: 50%; background: #fff; }
#bubble { background: #fff; border-radius: 34px; padding: 30px 38px; box-shadow: 0 14px 40px rgba(10,46,42,.14); border: 3px solid #D7E3DF; }
#bubble .tail { position: absolute; top: 120px; width: 0; height: 0; border-top: 26px solid transparent; border-bottom: 26px solid transparent; }
#words { font-size: 34px; line-height: 1.55; font-weight: 500; }
#words span { display: inline; }
#panel { background: #fff; border-radius: 40px; box-shadow: 0 18px 50px rgba(10,46,42,.13); overflow: hidden; }
.scene { position: absolute; inset: 0; padding: 48px 46px; display: flex; flex-direction: column; gap: 22px; }
.h { font-size: 40px; font-weight: 700; color: #0A4740; }
.muted { color: #5B6770; }
.chip { display: inline-flex; align-items: center; gap: 12px; padding: 14px 22px; border-radius: 18px; font-size: 28px; font-weight: 600; }
.row { display: flex; align-items: center; gap: 18px; }
.card { border-radius: 24px; padding: 22px 26px; }
.msg { background: #EEF1F0; font-size: 28px; line-height: 1.55; border-radius: 22px 22px 22px 6px; padding: 22px 26px; }
.msg b { color: #1F5FBF; font-weight: 500; direction: ltr; unicode-bidi: isolate; }
.result { border: 4px solid #B42318; background: #FEF3F2; }
.result .label { color: #A11D12; font-size: 34px; font-weight: 700; }
.reason { font-size: 27px; display: flex; gap: 12px; align-items: baseline; }
.reason::before { content: ""; flex: none; width: 12px; height: 12px; border-radius: 50%; background: #B42318; transform: translateY(-4px); }
.step { display: flex; gap: 18px; align-items: center; font-size: 29px; font-weight: 500; }
.num { flex: none; width: 56px; height: 56px; border-radius: 50%; background: #0A4740; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; }
.pill { flex: 1; border-radius: 24px; padding: 18px 22px; text-align: center; }
.pill .big { font-size: 50px; font-weight: 700; direction: ltr; white-space: nowrap; }
.pill .small { font-size: 24px; font-weight: 600; }
.field { display: flex; justify-content: space-between; align-items: center; font-size: 29px; padding: 16px 4px; border-bottom: 2px solid #EEF1F0; }
.field .v { font-weight: 700; display: flex; align-items: center; gap: 12px; }
.tick { width: 38px; height: 38px; border-radius: 50%; background: #1E8E5A; display: inline-flex; align-items: center; justify-content: center; }
.voice { display: flex; align-items: center; gap: 16px; background: #E4F2EC; border-radius: 40px; padding: 16px 24px; }
.bars { display: flex; gap: 6px; align-items: center; height: 46px; }
.bars i { display: block; width: 7px; border-radius: 4px; background: #0A4740; }
.ready { background: #E7F5EE; border: 3px solid #1E8E5A; color: #10633D; font-size: 31px; font-weight: 700; }
.people { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }
.person { height: 74px; display: flex; justify-content: center; }
.banner { border: 4px solid #B08A3E; background: #FFF8E8; font-size: 30px; font-weight: 700; color: #6B4E12; }
.lang { font-size: 40px; font-weight: 700; padding: 18px 30px; border-radius: 22px; background: #E4F2EC; color: #0A4740; }
.priv { font-size: 30px; font-weight: 600; display: flex; gap: 16px; align-items: center; }
.slogan1 { font-size: 120px; font-weight: 700; color: #B08A3E; line-height: 1.1; text-align: center; }
.slogan2 { font-size: 72px; font-weight: 700; color: #0A4740; text-align: center; line-height: 1.2; }
.center { align-items: center; justify-content: center; text-align: center; }
</style>
</head>
<body>
<div id="stage">
  <img id="map" class="abs" src="../poster/uae-map.svg" alt="">
  <div id="panel" class="abs"></div>
  <svg id="haris" class="abs" width="620" height="775" viewBox="0 0 640 800" style="overflow:visible">
    <ellipse cx="320" cy="782" rx="190" ry="14" fill="#DCE5E2"/>
    <path d="M232 770 h72 a8 8 0 0 1 0 16 h-72 a8 8 0 0 1 0-16 Z" fill="#6B4A2F"/>
    <path d="M336 770 h72 a8 8 0 0 1 0 16 h-72 a8 8 0 0 1 0-16 Z" fill="#6B4A2F"/>
    <g id="body">
      <path d="M180 335 C186 302 236 288 320 288 C404 288 454 302 460 335 L506 760 C450 774 190 774 134 760 Z" fill="#FFFFFF" stroke="#D5DEDB" stroke-width="3"/>
      <path d="M320 300 L320 400" stroke="#C9D3D0" stroke-width="5" stroke-linecap="round"/>
      <g id="armR">
        <path d="M442 338 C492 372 512 462 506 560 L452 566 C454 486 444 424 402 384 Z" fill="#FFFFFF" stroke="#D5DEDB" stroke-width="3"/>
        <ellipse cx="480" cy="580" rx="26" ry="28" fill="#D9A47A"/>
      </g>
      <g id="armL">
        <path d="M198 338 C148 372 128 462 134 560 L188 566 C186 486 196 424 238 384 Z" fill="#FFFFFF" stroke="#D5DEDB" stroke-width="3"/>
        <ellipse cx="160" cy="580" rx="26" ry="28" fill="#D9A47A"/>
      </g>
      <g id="head">
        <g transform="translate(320 178) scale(2.4) translate(-100 -98)">
          <path d="M52 92 C50 60 70 38 100 38 C130 38 150 60 148 92 L156 150 C140 160 128 150 124 140 L76 140 C72 150 60 160 44 150 Z" fill="#FFFFFF" stroke="#D5DEDB" stroke-width="2"/>
          <ellipse cx="100" cy="98" rx="30" ry="35" fill="#D9A47A"/>
          <path d="M66 84 C66 60 82 52 100 52 C118 52 134 60 134 84 C128 72 116 66 100 66 C84 66 72 72 66 84 Z" fill="#FFFFFF" stroke="#D5DEDB" stroke-width="1.5"/>
          <ellipse cx="100" cy="62" rx="37" ry="8" fill="none" stroke="#1F2933" stroke-width="6"/>
          <ellipse cx="100" cy="55" rx="34" ry="6.5" fill="none" stroke="#1F2933" stroke-width="5"/>
          <g id="brows">
            <path d="M80 85 Q87 80 94 84" fill="none" stroke="#3B2A20" stroke-width="3" stroke-linecap="round"/>
            <path d="M106 84 Q113 80 120 85" fill="none" stroke="#3B2A20" stroke-width="3" stroke-linecap="round"/>
          </g>
          <ellipse id="eyeL" cx="88" cy="94" rx="4" ry="5" fill="#1F2933"/>
          <ellipse id="eyeR" cx="112" cy="94" rx="4" ry="5" fill="#1F2933"/>
          <g id="shine"><circle cx="89.5" cy="92.3" r="1.4" fill="#FFFFFF"/><circle cx="113.5" cy="92.3" r="1.4" fill="#FFFFFF"/></g>
          <ellipse cx="80" cy="106" rx="5" ry="3" fill="#E58E73" opacity=".45"/>
          <ellipse cx="120" cy="106" rx="5" ry="3" fill="#E58E73" opacity=".45"/>
          <path d="M71 104 C72 126 86 136 100 136 C114 136 128 126 129 104 C124 118 114 124 100 124 C86 124 76 118 71 104 Z" fill="#3B2A20"/>
          <path d="M88 112 Q100 106 112 112 Q100 110 88 112 Z" fill="#3B2A20" stroke="#3B2A20" stroke-width="3" stroke-linejoin="round"/>
          <path id="smile" d="M91 117 Q100 124 109 117" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
          <g id="mouth">
            <ellipse id="mouthO" cx="100" cy="119" rx="7" ry="3" fill="#7A2B2B"/>
            <path id="teeth" d="M94 117 Q100 115.5 106 117" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
          </g>
        </g>
      </g>
    </g>
  </svg>
  <div id="bubble" class="abs"><div class="tail"></div><div id="words"></div></div>
  <div id="band" class="abs"><img src="../../frontend/haris.svg" alt=""><span id="footer"></span></div>
</div>
<script>
const W = 1920;
let D, scenes = {}, rtl = true, LAYOUT = {};

const el = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; };
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const TICK = '<span class="tick"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></span>';
const PERSON = (c) => `<svg width="62" height="74" viewBox="0 0 62 74"><circle cx="31" cy="18" r="15" fill="${c}"/><path d="M4 72 C4 48 16 38 31 38 C46 38 58 48 58 72 Z" fill="${c}"/></svg>`;
const LOCK = '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#0A4740" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
const EYE = '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#0A4740" stroke-width="2.2" stroke-linecap="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3.2 3.9M6.6 6.6C3.9 8.4 2 12 2 12s4 7 10 7a10 10 0 0 0 5.4-1.6"/></svg>';
const SHIELD = '<svg width="150" height="150" viewBox="0 0 24 24" fill="#0A4740"><path d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5Z"/><path d="m8.5 12 2.5 2.5 4.5-5" stroke="#E7C77A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CHAT = '<svg width="46" height="46" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.7 15L2 22l5.2-1.3A10 10 0 1 0 12 2Z"/></svg>';
const PDF = '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#10633D" stroke-width="2" stroke-linecap="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5M9 14h6M9 17h4"/></svg>';

function buildScenes(ui) {
  const link = (s) => esc(s).replace(/([a-z0-9-]+\.[a-z]{2,}(\/\S*)?)/i, "<b>$1</b>");
  const make = {
    intro: `<div class="scene center"><img src="../../frontend/haris.svg" style="width:300px;height:300px;border-radius:50%;border:8px solid #E7C77A;background:#fff" alt="">
      <div class="h" style="font-size:96px">${esc(ui.title)}</div><div class="muted" style="font-size:34px;line-height:1.5">${esc(ui.tagline)}</div></div>`,
    check: `<div class="scene"><div class="muted" style="font-size:26px;font-weight:600" data-a="0.02">${esc(ui.msg_from)}</div>
      <div class="msg" data-a="0.04">${link(ui.scam)}</div>
      <div class="row" data-a="0.18" data-z="0.4" style="font-size:28px;color:#0A4740;font-weight:600"><span>${esc(ui.checking)}</span><div style="flex:1;height:12px;border-radius:6px;background:#E4ECEA;overflow:hidden"><div data-bar="0.18,0.38" style="height:100%;background:#0A4740;width:0"></div></div></div>
      <div class="card result" data-a="0.4"><div class="label">🔴 ${esc(ui.risk)}</div>
        <div style="display:flex;flex-direction:column;gap:12px;margin-top:16px">${ui.reasons.map((r, i) => `<div class="reason" data-a="${0.5 + i * 0.1}">${esc(r)}</div>`).join("")}</div></div></div>`,
    help: `<div class="scene"><div class="h">${esc(ui.help_title)}</div>
      ${ui.steps.map((s, i) => `<div class="step" data-a="${0.08 + i * 0.14}"><span class="num">${i + 1}</span><span>${esc(s)}</span></div>`).join("")}
      <div class="row" style="margin-top:auto;gap:22px;align-items:stretch"><div class="pill" data-a="0.62" style="background:#FEF3F2;color:#A11D12"><div class="big">999</div><div class="small">${esc(ui.emergency)}</div></div>
      <div class="pill" data-a="0.74" style="background:#E4F2EC;color:#0A4740"><div class="big">800 2626</div><div class="small">${esc(ui.aman)}</div></div></div></div>`,
    report: `<div class="scene"><div class="h">${esc(ui.report_title)}</div>
      <div class="voice" data-a="0.05"><span class="num" style="width:60px;height:60px">▶</span><div class="bars">${Array.from({ length: 22 }, (_, i) => `<i data-wave="${i}"></i>`).join("")}</div></div>
      <div>${ui.fields.map((f, i) => `<div class="field" data-a="${0.28 + i * 0.15}"><span class="muted">${esc(f[0])}</span><span class="v">${esc(f[1])} ${TICK}</span></div>`).join("")}</div>
      <div class="card ready row" data-a="0.8" style="margin-top:auto">${PDF}<span>${esc(ui.ready)}</span></div></div>`,
    radar: `<div class="scene"><div class="h">${esc(ui.radar_title)}</div>
      <div class="people">${Array.from({ length: 12 }, (_, i) => `<div class="person" data-person="${i}">${PERSON("#0A4740")}</div>`).join("")}</div>
      <div class="row" style="font-size:34px;font-weight:700;color:#0A4740"><span data-count style="font-size:64px;direction:ltr">0</span><span>${esc(ui.reports)}</span></div>
      <div class="chip" data-a="0.22" style="background:#FFF1E6;color:#9A4A06;align-self:flex-start">⚠️ ${esc(ui.warn)}</div>
      <div class="chip" data-a="0.56" style="background:#0A4740;color:#fff;align-self:flex-start">🛡️ ${esc(ui.alert)}</div>
      <div class="card banner" data-a="0.78" style="margin-top:auto">📢 ${esc(ui.official)}</div></div>`,
    langs: `<div class="scene"><div class="h">${esc(ui.langs_title)}</div>
      <div style="display:flex;flex-wrap:wrap;gap:18px">${["العربية", "English", "اردو", "हिन्दी"].map((l, i) => `<div class="lang" data-a="${0.05 + i * 0.1}">${l}</div>`).join("")}</div>
      <div style="margin-top:auto;display:flex;flex-direction:column;gap:26px"><div class="priv" data-a="0.55">${LOCK}<span>${esc(ui.privacy[0])}</span></div>
      <div class="priv" data-a="0.7">${EYE}<span>${esc(ui.privacy[1])}</span></div></div></div>`,
    disclaimer: `<div class="scene center" style="gap:30px">${SHIELD}<div class="h" style="font-size:46px;line-height:1.4">${esc(ui.not_official)}</div>
      <div data-a="0.5" class="muted" style="font-size:32px;font-weight:600">${esc(ui.call)}</div>
      <div data-a="0.55" style="font-size:120px;font-weight:700;color:#B42318;direction:ltr">999</div></div>`,
    outro: `<div class="scene center" style="gap:16px;background:#0A4740"><div class="slogan1">${esc(ui.slogan1)}</div>
      <div class="slogan2" style="color:#fff">${esc(ui.slogan2)}</div>
      <div class="chip" data-a="0.35" style="margin-top:40px;background:#1E8E5A;color:#fff;font-size:36px;padding:20px 34px">${CHAT}<span>${esc(ui.soon)}</span></div></div>`,
  };
  const panel = document.getElementById("panel");
  for (const [k, html] of Object.entries(make)) { const s = el(html); s.dataset.scene = k; panel.appendChild(s); scenes[k] = s; }
}

function place(id, x, y, w, h) {
  const n = document.getElementById(id);
  const left = rtl ? x : W - x - w;
  Object.assign(n.style, { left: left + "px", top: y + "px", width: w + "px" });
  if (h) n.style.height = h + "px";
}

function init(data) {
  D = data;
  rtl = D.dir === "rtl";
  document.documentElement.dir = D.dir;
  document.documentElement.lang = D.lang;
  document.body.style.setProperty("--font", `"${D.font}"`);
  document.getElementById("footer").textContent = D.ui.footer;
  buildScenes(D.ui);
  place("panel", 90, 120, 640, 800);
  place("bubble", 780, 90, 560);
  place("haris", 1250, 200, 620, 775);
  place("map", 1010, 270, 880);
  const tail = document.querySelector("#bubble .tail");
  if (rtl) { tail.style.right = "-26px"; tail.style.borderLeft = "28px solid #fff"; }
  else { tail.style.left = "-26px"; tail.style.borderRight = "28px solid #fff"; }
  if (!rtl) document.getElementById("haris").style.transform = "scaleX(-1)";
  D.lines.forEach((l, i) => { l.words = l.show.split(/\s+/); l.i = i; });
}

function lineAt(t) {
  let cur = D.lines[0];
  for (const l of D.lines) if (t >= l.t0 - 0.35) cur = l;
  return cur;
}

function render(t) {
  const L = lineAt(t);
  const fps = 30, f = Math.min(D.env.length - 1, Math.max(0, Math.round(t * fps)));
  const amp = D.env[f] || 0;
  const talking = t >= L.t0 && t <= L.t1;

  // speech bubble: words appear as they are spoken
  const p = clamp((t - L.t0) / Math.max(0.1, L.t1 - L.t0) * 1.08);
  const shown = t < L.t0 ? 0 : Math.ceil(p * L.words.length);
  const words = document.getElementById("words");
  if (words.dataset.line !== String(L.i)) {
    words.innerHTML = L.words.map((w) => `<span>${esc(w)}</span> `).join("");
    words.dataset.line = String(L.i);
  }
  [...words.children].forEach((s, i) => { s.style.visibility = i < shown ? "visible" : "hidden"; });
  const bub = document.getElementById("bubble");
  const pop = ease((t - (L.t0 - 0.35)) / 0.3);
  bub.style.opacity = String(L.i === 0 ? pop : 1);
  bub.style.transform = `scale(${0.96 + 0.04 * (L.i === 0 ? pop : 1)})`;

  // scene panel: crossfade between lines, and items appear through the line
  for (const [k, s] of Object.entries(scenes)) {
    const lines = D.lines.filter((l) => l.scene === k);
    let vis = 0, local = 0;
    for (const l of lines) {
      const next = D.lines[l.i + 1];
      const start = l.t0 - 0.35, end = next ? next.t0 - 0.35 : D.total + 1;
      if (t >= start - 0.3 && t < end) {
        vis = Math.min(ease((t - start + 0.3) / 0.3), ease((end - t) / 0.3));
        local = clamp((t - l.t0) / Math.max(0.1, l.t1 - l.t0));
      }
    }
    s.style.opacity = String(vis);
    s.style.transform = `translateY(${(1 - vis) * 24}px)`;
    s.style.visibility = vis > 0 ? "visible" : "hidden";
    if (!vis) continue;
    s.querySelectorAll("[data-a]").forEach((n) => {
      const a = parseFloat(n.dataset.a), z = n.dataset.z ? parseFloat(n.dataset.z) : null;
      let o = ease((local - a) / 0.08);
      if (z !== null) o = Math.min(o, ease((z - local) / 0.06));
      n.style.opacity = String(o);
      n.style.transform = `translateY(${(1 - o) * 16}px)`;
    });
    s.querySelectorAll("[data-bar]").forEach((n) => {
      const [a, b] = n.dataset.bar.split(",").map(Number);
      n.style.width = (clamp((local - a) / (b - a)) * 100) + "%";
    });
    s.querySelectorAll("[data-wave]").forEach((n) => {
      const i = +n.dataset.wave;
      n.style.height = (10 + 34 * Math.abs(Math.sin(i * 1.7 + t * 6)) * (local < 0.3 ? 1 : 0.35)) + "px";
    });
    const people = s.querySelectorAll("[data-person]");
    if (people.length) {
      const n = Math.round(clamp((local - 0.04) / 0.5) * 12);
      people.forEach((pp, i) => { pp.style.opacity = i < n ? "1" : "0.12"; pp.querySelectorAll("circle,path").forEach((x) => x.setAttribute("fill", i < n ? (n >= 10 ? "#B42318" : n >= 3 ? "#C2410C" : "#0A4740") : "#0A4740")); });
      s.querySelector("[data-count]").textContent = String(n);
    }
  }

  // Haris: breathing, blinking, mouth following the voice, gestures
  const bob = Math.sin(t * 2.1) * 4;
  document.getElementById("body").setAttribute("transform", `translate(0 ${bob})`);
  const blink = ((t + 0.7) % 3.9) < 0.13 || ((t + 2.3) % 7.3) < 0.12;
  ["eyeL", "eyeR"].forEach((id) => document.getElementById(id).setAttribute("ry", blink ? "0.6" : "5"));
  document.getElementById("shine").style.opacity = blink ? "0" : "1";
  const open = talking ? amp : 0;
  document.getElementById("smile").style.opacity = open > 0.08 ? "0" : "1";
  document.getElementById("mouth").style.opacity = open > 0.08 ? "1" : "0";
  document.getElementById("mouthO").setAttribute("ry", String(0.8 + open * 5.2));
  document.getElementById("mouthO").setAttribute("rx", String(6 + open * 1.5));
  const tilt = talking ? Math.sin(t * 2.7) * 2.2 : Math.sin(t * 1.3) * 0.8;
  document.getElementById("head").setAttribute("transform", `rotate(${tilt} 320 300)`);
  document.getElementById("brows").setAttribute("transform", `translate(0 ${talking ? -amp * 1.6 : 0})`);

  let arm = 0;
  if (L.scene === "outro" && t >= L.t0 - 0.3) arm = 125 + Math.sin(t * 9) * 14 * ease((t - L.t0) / 0.4);
  else {
    const up = ease((t - (L.t0 - 0.3)) / 0.45), down = ease((L.t1 + 0.1 - t) / 0.45);
    arm = 38 * Math.min(up, down) + Math.sin(t * 3.3) * 4 * Math.min(up, down);
  }
  document.getElementById("armL").setAttribute("transform", `rotate(${arm} 205 348)`);
}
</script>
</body>
</html>
