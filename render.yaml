# Render Blueprint: Haris as one free web service, plus a free Postgres database that keeps its data with a fixed address (https://haris-uae.onrender.com
# or similar). Secrets are typed into Render's dashboard, never committed: every key marked
# "sync: false" is asked for when the Blueprint is created.
services:
  - type: web
    name: haris-uae
    runtime: python
    plan: free
    region: frankfurt
    branch: master
    autoDeploy: true
    # Each deploy starts the free disk afresh, so only changes to the running app redeploy it.
    buildFilter:
      paths:
        - backend/**
        - frontend/**
        - requirements.txt
        - render.yaml
        - scripts/inbox_demo.py
        - scripts/alerts_demo.py
    healthCheckPath: /api/health
    # The demo reports are made without the AI key, so the build never waits on translation calls.
    buildCommand: >-
      pip install -r requirements.txt &&
      if [ "$HARIS_DEMO_DATA" = "1" ]; then env -u GEMINI_API_KEY -u ANTHROPIC_API_KEY python scripts/inbox_demo.py --clear && python scripts/alerts_demo.py; fi
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    envVars:
      - key: DATABASE_URL             # reports, subscribers and the radar survive restarts and deploys
        fromDatabase:
          name: haris-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: HARIS_DEMO_DATA          # fictional reports and alert subscribers for the dashboard demo
        value: "1"
      - key: HARIS_AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_FALLBACK_MODEL     # a second Gemini model, used while the main one is paused (own free limit)
        sync: false
      - key: HARIS_SITE_CHECK          # open suspicious links in a safe sandbox and judge the page
        value: "1"
      - key: GOOGLE_SAFE_BROWSING_KEY  # optional free threat-list check; left unset is fine
        sync: false
      - key: HARIS_AUTHORITY_TOKEN    # the dashboard's access code
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        value: "1362368773636702"
      - key: WHATSAPP_PUBLIC_NUMBER
        value: "971503123535"
      - key: HARIS_WEBSITE
        value: https://claude.ai/artifact/Kb2rxU4cMeUmkumdnJZDkv

databases:
  - name: haris-db
    plan: free          # Render's free Postgres expires 30 days after it is created
    region: frankfurt
    databaseName: haris
    user: haris
