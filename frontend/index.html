<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="حارس: مساعد ذكي يحميك من الاحتيال والجرائم الإلكترونية">
  <title>حارس | Haris</title>
  <link rel="icon" href="haris.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=20261121c">
</head>
<body>
  <main class="phone" aria-label="Haris chat">
    <header class="topbar">
      <div class="avatar" aria-hidden="true">
        <img src="haris.svg" alt="" width="42" height="42">
      </div>
      <div class="who">
        <h1 id="bot-name">حارس</h1>
        <p id="bot-status">مساعد ذكي · ليس جهة رسمية</p>
      </div>
      <nav class="langs" aria-label="Language">
        <button type="button" data-lang="ar" aria-pressed="true">ع</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
        <button type="button" data-lang="ur" aria-pressed="false">اردو</button>
        <button type="button" data-lang="hi" aria-pressed="false" lang="hi">हिन्दी</button>
        <button type="button" data-lang="ru" aria-pressed="false" lang="ru">RU</button>
      </nav>
    </header>

    <section id="chat" class="chat" aria-live="polite" aria-relevant="additions"></section>

    <div id="chips" class="chips" role="group" aria-label="Quick replies"></div>

    <div id="pending" class="pending" aria-live="polite"></div>

    <form id="composer" class="composer" autocomplete="off">
      <button id="attach" class="tool" type="button" aria-label="إرفاق لقطة شاشة" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M16.5 6.5v10a4.5 4.5 0 0 1-9 0V5a3 3 0 0 1 6 0v10.5a1.5 1.5 0 0 1-3 0V6.5H9v9a3 3 0 0 0 6 0V5a4.5 4.5 0 0 0-9 0v11.5a6 6 0 0 0 12 0v-10h-1.5Z"/></svg>
      </button>
      <input id="file" type="file" accept="image/*" multiple hidden>
      <label for="input" class="sr-only" id="input-label">اكتب رسالتك</label>
      <textarea id="input" rows="1" maxlength="5000" placeholder="الصق الرسالة المشبوهة هنا..."></textarea>
      <button id="mic" class="tool" type="button" aria-label="تحدّث بدل الكتابة" aria-pressed="false" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
      </button>
      <button id="send" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M3 20.5 21 12 3 3.5v6.6L15 12 3 13.9v6.6Z"/></svg>
      </button>
    </form>
  </main>
  <script src="app.js?v=20261121g"></script>
</body>
</html>
