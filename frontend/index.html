<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="حصين: مساعد ذكي يحميك من الاحتيال والجرائم الإلكترونية">
  <title>حصين | Haseen</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="phone" aria-label="Haseen chat">
    <header class="topbar">
      <div class="avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3Zm-1 14.2-3.6-3.6 1.4-1.4 2.2 2.2 4.8-4.8 1.4 1.4-6.2 6.2Z"/></svg>
      </div>
      <div class="who">
        <h1 id="bot-name">حصين</h1>
        <p id="bot-status">مساعد ذكي · ليس جهة رسمية</p>
      </div>
      <nav class="langs" aria-label="Language">
        <button type="button" data-lang="ar" aria-pressed="true">ع</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
        <button type="button" data-lang="ur" aria-pressed="false">اردو</button>
      </nav>
    </header>

    <section id="chat" class="chat" aria-live="polite" aria-relevant="additions"></section>

    <div id="chips" class="chips" role="group" aria-label="Quick replies"></div>

    <form id="composer" class="composer" autocomplete="off">
      <label for="input" class="sr-only" id="input-label">اكتب رسالتك</label>
      <textarea id="input" rows="1" maxlength="5000" placeholder="الصق الرسالة المشبوهة هنا..."></textarea>
      <button id="send" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M3 20.5 21 12 3 3.5v6.6L15 12 3 13.9v6.6Z"/></svg>
      </button>
    </form>
  </main>
  <script src="app.js"></script>
</body>
</html>
