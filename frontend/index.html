<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="حارس: مساعد ذكي يحميك من الاحتيال والجرائم الإلكترونية">
  <title>حارس | Haris</title>
  <link rel="icon" href="haris.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="phone" aria-label="Haris chat">
    <header class="topbar">
      <div class="avatar" aria-hidden="true">
        <img src="haris.svg" alt="" width="42" height="42">
      </div>
      <div class="who">
        <h1 id="bot-name">حارس</h1>
        <p id="bot-status">مساعد ذكي · ليس جهة رسمية</p>
      </div>
      <nav class="langs" aria-label="Language">
        <button type="button" data-lang="ar" aria-pressed="true">ع</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
        <button type="button" data-lang="ur" aria-pressed="false">اردو</button>
      </nav>
    </header>

    <section id="chat" class="chat" aria-live="polite" aria-relevant="additions"></section>

    <div id="chips" class="chips" role="group" aria-label="Quick replies"></div>

    <form id="composer" class="composer" autocomplete="off">
      <label for="input" class="sr-only" id="input-label">اكتب رسالتك</label>
      <textarea id="input" rows="1" maxlength="5000" placeholder="الصق الرسالة المشبوهة هنا..."></textarea>
      <button id="send" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M3 20.5 21 12 3 3.5v6.6L15 12 3 13.9v6.6Z"/></svg>
      </button>
    </form>
  </main>
  <script src="app.js"></script>
</body>
</html>
